name: daily-growth

# 每天自动跑一次：Buddy 加油站签到状态 + 派猫猫旅行（先领到家积分，再按需派新一趟）
on:
  # 应急触发：改动本 workflow 文件并推送即立刻跑一次。
  # 用途：GitHub 调度器丢槽位时（2026-10-15 实测两连丢），推送一次即可补跑当天任务。
  # 只盯 workflow 文件本身的变更，普通文档提交不会触发。
  push:
    branches: [main]
    paths: ['.github/workflows/daily-growth.yml']
  schedule:
    # UTC 时间。默认每小时 07:05~12:05 UTC = 北京时间 15:05~20:05。
    # 为什么是多档位：GitHub 调度器对新仓库会整槽丢弃（2026-10-15 实测三连丢），
    # 单档 cron 形同虚设；多档位轮询保证每天至少一档跑成。
    # 脚本幂等（一天只派一次由服务端硬限制保证），且只在"有实质动作"
    # （领积分/派新趟/出错）时才推企业微信，跑成几档都不会刷屏。
    # 想改时间就改这一行（分 时 * * *），注意是 UTC。
    - cron: "5 7-12 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发，便于立即验收

# 本地 fallback 标记：本机定时任务取不到 token（如 App 升级加密登录态）时，
# 本机 automation 会更新这行并推送来触发云端运行。不要手动删这行。
# last-local-fallback: 2026-10-20 20:06:12

# 2026-10-19 10:0x：新增「任务奖励捡漏」（do_tasks：领取 accept_status=completed
# 的任务奖励），本次改动一并触发即时运行做验收（会派今天的猫 + 领 expert_5 奖励）。

# 2026-10-19 13:0x：新增「每日打卡领取」（do_daily_checkin：App 菜单弹窗
# 「Buddy加油站·每日可领100积分」的同一发放口 = POST /billing/meter/daily-checkin，
# 端点来自主进程 main/account.js 的 CloudAccountRepo.checkin）。流程：先
# POST /billing/meter/checkin-activity-status 读状态，active 且今日未领才领；
# 服务端 1001（已领取）/状态已领时不重复领。本次改动触发即时运行做验收
# （今天 11:03 用户已手动领过，预期返回"今日已领 100 积分"并展示连签天数）。

# 避免同一时刻重复跑排队
concurrency:
  group: daily-growth
  cancel-in-progress: false

# contents:write 是给「Publish run record」步骤用的：每次运行把脱敏结果
# 提交回仓库，之后随时可经 GitHub 页面/API 直接查看历史运行记录。
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5 = Node 24 运行时。v4 停留在 Node 20，已废弃（GitHub 将于
        # 2026-09-23 起彻底移除 Node 20 运行时，届时 v4 会在启动时直接失败）。
        uses: actions/checkout@v5

      - name: Resolve Python (command -v, no hardcoded version)
        id: py
        run: |
          PY=$(command -v python3 || command -v python || true)
          if [ -z "$PY" ]; then echo "::error::python3/python not found"; exit 1; fi
          echo "python=$PY" >> "$GITHUB_OUTPUT"
          "$PY" --version

      - name: Renew access token (seamless, optional)
        id: renew
        continue-on-error: true
        env:
          WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
          WB_GH_PAT: ${{ secrets.WB_GH_PAT }}
        run: |
          if [ -z "${WB_REFRESH_TOKEN:-}" ]; then
            echo "未配置 WB_REFRESH_TOKEN，跳过无感续签，回退 WB_TOKEN"
            exit 0
          fi
          set +e
          AT=$("${{ steps.py.outputs.python }}" scripts/renew_token.py)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ] || [ "$RC" -eq 2 ]; then
            echo "::add-mask::$AT"
            echo "WB_TOKEN=$AT" >> "$GITHUB_ENV"
            if [ "$RC" -eq 2 ]; then
              echo "::warning::续签成功但 secret 写回失败，自动续期链约 60 天后会断"
              echo "WB_RENEW_WARN=1" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::token 续签失败，本次回退到 WB_TOKEN"
            exit 1
          fi

      - name: Run daily growth automation
        # 到账验证：以 travel/records 的 claimed_at 为服务端真相（2026-10-16 起）。
        # 旅行奖励只进积分池，能量余额不动是正常现象，不能作为未到账判据。
        env:
          # 续签成功用新 token，否则回退 secret 里的 WB_TOKEN
          WB_TOKEN: ${{ env.WB_TOKEN || secrets.WB_TOKEN }}
          WB_RENEW_WARN: ${{ env.WB_RENEW_WARN }}
          WB_WECOM_WEBHOOK: ${{ secrets.WB_WECOM_WEBHOOK }}
          # 可选：指定派猫目的地 id；缺省自动取第一个地点
          WB_TRAVEL_LOCATION_ID: ${{ secrets.WB_TRAVEL_LOCATION_ID }}
          # 打开后会在日志打印脱敏的原始返回（不含 token）
          WB_DEBUG_RAW: "1"
        run: |
          set +e
          "${{ steps.py.outputs.python }}" scripts/daily_growth.py > run-output.txt 2>&1
          RUN_RC=$?
          set -e
          cat run-output.txt
          echo "RUN_RC=$RUN_RC" | tee -a run-output.txt
          exit "$RUN_RC"

      - name: Publish run record (redacted, inspectable via repo)
        # 把本次运行的脱敏完整输出提交回仓库 logs/actions/last-run.txt。
        # 用途：远程查看每次运行到底发生了什么（领取前后余额对比、原始返回），
        # 不需要截图 Actions 日志。任何失败都不影响主流程。
        # 注意：此步骤依赖 .gitignore 里的白名单（!logs/actions/last-run.txt），
        # 二者必须同步修改，否则记录会被忽略而提交不上来。
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs/actions
          cp run-output.txt "logs/actions/last-run.txt"
          git config user.name "WorkBuddy CI"
          git config user.email "noreply@local"
          git add logs/actions/last-run.txt
          git diff --cached --quiet && { echo "run record 无变化，跳过提交"; exit 0; }
          git -c user.name="WorkBuddy CI" -c user.email="noreply@local" \
            commit -m "ci: run record $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git pull --rebase origin main >/dev/null 2>&1 || true
          git push origin HEAD:main || echo "::warning::run record 推送失败（不影响本次运行结果）"
